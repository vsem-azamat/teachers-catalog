# Production stack. Nothing here is built on the server: CI pushes immutable
# images to GHCR and this file pulls the exact tag that passed CI.
#
# Only `caddy` publishes a port, and only on loopback. Public TLS belongs to the
# shared Edge Caddy on the host, which proxies the hostname to that port.

name: students-cz

services:
  postgres:
    # The same image as development, and for the same reason: the schema needs
    # pg_trgm, unaccent and btree_gist, and semantic search will need vector.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=cs-CZ --encoding=UTF8"
    volumes:
      # /var/lib/postgresql, not .../data: Postgres 18 moved PGDATA and the
      # declared volume, and the old path silently leaves the real data
      # directory inside the container layer.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # Run by the deploy script with `compose run --rm` before the API starts, so
  # a failed migration stops the deployment instead of crash-looping the API.
  migrate:
    image: ghcr.io/${GHCR_OWNER}/students-cz-api:${IMAGE_TAG}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    # Behind a profile so `up` leaves it alone. `compose run` enables the
    # profile of whatever it is asked to run, so the deploy still gets it.
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: [no-new-privileges:true]

  # Derived data, so it runs on every deploy and costs nothing when the catalog
  # and the model are unchanged. Same image as the API, which is where the model
  # lives; see docs/data-model.md.
  embed:
    image: ghcr.io/${GHCR_OWNER}/students-cz-api:${IMAGE_TAG}
    command: ["python", "-m", "students_cz.db.embed"]
    restart: "no"
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: [no-new-privileges:true]

  api:
    image: ghcr.io/${GHCR_OWNER}/students-cz-api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BOT_TOKEN: ${BOT_TOKEN}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_HOST}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INIT_DATA_MAX_AGE_SECONDS: ${INIT_DATA_MAX_AGE_SECONDS:-86400}
      # Never true here. It would let anyone claim to be anyone.
      ALLOW_UNSIGNED_INIT_DATA: "false"
      CORS_ORIGINS: '["${PUBLIC_HOST}"]'
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  frontend:
    image: ghcr.io/${GHCR_OWNER}/students-cz-web:${IMAGE_TAG}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Loopback only. Publishing on a wildcard would put the app on the
      # internet without TLS, bypassing the edge entirely; the deploy script
      # asserts this binding after every start.
      - "127.0.0.1:${PUBLIC_PORT}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: {condition: service_healthy}
      frontend: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  backup:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./data/backups:/backups
    depends_on:
      postgres: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        while true; do
          now=$$(date -u +%s)
          # Next occurrence of BACKUP_HOUR_UTC:00, today or tomorrow.
          target=$$(date -u -d "today ${BACKUP_HOUR_UTC:-3}:00" +%s)
          [ "$$target" -le "$$now" ] && target=$$(date -u -d "tomorrow ${BACKUP_HOUR_UTC:-3}:00" +%s)
          sleep $$((target - now))
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          if pg_dump --format=custom --file="/backups/students-cz-$$stamp.dump.part"; then
            # Renamed only once complete, so a partial file is never mistaken
            # for a usable backup.
            mv "/backups/students-cz-$$stamp.dump.part" "/backups/students-cz-$$stamp.dump"
            echo "backup ok: students-cz-$$stamp.dump"
          else
            rm -f "/backups/students-cz-$$stamp.dump.part"
            echo "backup FAILED at $$stamp" >&2
          fi
          # Both prefixes: the dumps taken before the rename are still on
          # disk under the old one, and a retention rule that stops seeing
          # them keeps them for ever.
          find /backups \( -name 'students-cz-*.dump' -o -name 'konnekt-*.dump' \) \
            -mtime "+$${BACKUP_RETENTION_DAYS:-14}" -delete
        done
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  # Named for what they are already called on the server, not for the project.
  # A compose volume is `<project>_<name>`, so renaming the project would point
  # postgres at a brand new empty one and the API would come up with no
  # database — and Caddy at an empty one, and re-issue every certificate
  # against Let's Encrypt's rate limits. The `konnekt` in these names is
  # history, and it is also the only place the data actually is. Renaming them
  # is a move of the data, not an edit of this file.
  postgres-data:
    name: konnekt_postgres-data
  caddy-data:
    name: konnekt_caddy-data
  caddy-config:
    name: konnekt_caddy-config
