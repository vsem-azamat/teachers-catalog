<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what lets the page paint under the notch and the
         home indicator; without it the Telegram safe-area insets are always 0. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Konnekt — кто поможет с учёбой в Чехии</title>
    <meta
      name="description"
      content="Репетиторы, подготовка к přijímačky, помощь на экзамене и нострификация — для студентов в Чехии. Открывается в Telegram."
    />
    <script>
      /*
       * The palette, before the first paint.
       *
       * This has to run here and not in the bundle: by the time a module
       * executes, the page has already been painted once, and a light flash
       * ahead of a dark app is worse than no theming at all. It is the same
       * key and the same resolution as src/lib/theme.ts — keep them in step.
       */
      (() => {
        let mode = null;
        try {
          mode = localStorage.getItem('konnekt.theme');
        } catch {
          // Private mode, or storage disabled. Fall through to the system.
        }
        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia?.('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.dataset.theme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
