server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Written by non-root nginx, so everything mutable lives in /tmp.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames never change contents, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must not be cached: it is the only file that names the current
    # asset hashes, and a stale copy points at bundles that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Used by the container health check, and cheap enough to answer always.
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Client-side routing: every unknown path is a route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
