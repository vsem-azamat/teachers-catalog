[project]
name = "konnekt-api"
version = "0.1.0"
description = "Konnekt — student help catalog for the Czech Republic: API and Telegram bot"
requires-python = ">=3.13"
dependencies = [
    # Babel comes with the i18n extra; the bot and the API share one catalog.
    "aiogram[i18n]>=3.30,<4",
    "alembic>=1.18",
    "asyncpg>=0.31",
    # 0.132 rejects JSON bodies without a proper Content-Type, 0.138 added
    # app.frontend() for serving the mini app's build output.
    "fastapi>=0.140",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.51",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/konnekt"]

[tool.ruff]
target-version = "py313"
line-length = 90
src = ["src"]
# Migration bodies are generated by Alembic; reformatting them creates
# diff noise and hides the one thing worth reviewing — the hand edits.
extend-exclude = ["src/konnekt/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Czech and Russian appear throughout the domain vocabulary and the
# comments explaining it; the confusable-character rules fire on every
# one of them and have nothing to say about correctness here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
