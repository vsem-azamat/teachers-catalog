# Retire @student_cz_bot, once, before BOT_TOKEN becomes the moderator bot's.
#
# See "Moving onto the moderator's token, once" in docs/deploy.md for where
# this sits in the order. It checks with getMe that the token is still the old
# bot's and refuses any other, so running it after the swap does nothing to
# the moderator bot. Delete this file once the cutover is done.
name: Retire the old bot

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type student_cz_bot to confirm
        required: true

permissions: {}

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Retire it
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CONFIRM: ${{ inputs.confirm }}
          OLD: student_cz_bot
          NEW: konnekt_moder_bot
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "$OLD" ] || { echo "confirmation does not match" >&2; exit 1; }

          call() {
            # The token never reaches the log: curl reads the URL from stdin.
            printf 'url = "https://api.telegram.org/bot%s/%s"\n' "$BOT_TOKEN" "$1" \
              | curl --fail --silent --show-error --max-time 20 --config - \
                  -H 'Content-Type: application/json' --data "${2:-{\}}"
            echo
          }

          name="$(call getMe | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["username"])')"
          if [ "$name" != "$OLD" ]; then
            echo "BOT_TOKEN belongs to @$name, not @$OLD — refusing to touch it" >&2
            exit 1
          fi

          call deleteWebhook '{"drop_pending_updates": true}'
          call setChatMenuButton '{"menu_button": {"type": "default"}}'
          call deleteMyCommands
          text="Каталог переехал в @$NEW — откройте его там."
          call setMyShortDescription "{\"short_description\": \"$text\"}"
          call setMyDescription "{\"description\": \"$text\"}"
