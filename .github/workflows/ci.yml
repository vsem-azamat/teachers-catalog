name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the run in progress; there is no value in finishing
  # a check against code nobody will merge.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        # The same image as development, not the plain one: the schema needs
        # pg_trgm, unaccent and btree_gist, and the tests exercise all three.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: students_cz
          POSTGRES_PASSWORD: students_cz
          POSTGRES_DB: students_cz
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U students_cz -d students_cz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5433
      # No bot token in CI, and the API tests need to authenticate somehow.
      # Signature handling is covered separately, against real HMAC.
      BOT_TOKEN: ''
      ALLOW_UNSIGNED_INIT_DATA: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Type-check
        # ty is in preview and will grow new diagnostics between releases, so
        # the version is pinned in the lockfile like everything else. A
        # checker that changes its mind on an unrelated push is a checker
        # people learn to ignore.
        run: uv run ty check src tests

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Check the models and the migrations agree
        # A model changed without a migration passes every test and then fails
        # on deploy. This is the only place that catches it.
        run: uv run alembic check

      - name: Seed reference data
        # The tests match against real subjects and institutions, because the
        # matching *is* the logic — "матан" has to reach calculus.
        run: |
          uv run python -m students_cz.db.seed
          uv run python -m students_cz.db.demo

      - name: Test
        run: uv run pytest -q

  deployment-config:
    # Deployment only runs after CI, so a broken compose file or an unparsable
    # route script would otherwise surface mid-deploy, against production.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/students-cz

    steps:
      - uses: actions/checkout@v4

      - name: The route script must parse
        run: bash -n apply-edge-route.sh

      - name: The compose file must resolve from the documented variables alone
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i -e 's|^GHCR_OWNER=.*|GHCR_OWNER=owner|' \
                 -e 's|^IMAGE_TAG=.*|IMAGE_TAG=prod-0000000|' \
                 -e 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=placeholder|' \
                 -e 's|^BOT_TOKEN=.*|BOT_TOKEN=placeholder|' \
                 -e 's|^PUBLIC_HOST=.*|PUBLIC_HOST=https://example.invalid|' \
                 -e 's|^PUBLIC_PORT=.*|PUBLIC_PORT=18086|' \
                 -e 's|^APP_URL=.*|APP_URL=https://app.invalid|' .env
          docker compose config > resolved.yml

      - name: Nothing may be published except the router, on loopback
        run: python3 check-ingress.py resolved.yml

      - name: The internal Caddyfile must be valid
        run: |
          docker run --rm -e APP_URL=https://app.invalid \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Each path goes to the backend that owns it
        run: |
          set -euo pipefail
          docker run --rm -e APP_URL=https://app.invalid \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile \
            | python3 check-routes.py https://app.invalid

  contract:
    # apps/api/openapi.json is the contract the Mini App (supervisor-telegram)
    # generates its client from, so a schema changed without `make contract`
    # types that client against an endpoint the API does not serve. Its own
    # job because the name is the error message.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: cd apps/api && uv sync --locked

      - name: The committed OpenAPI document must match the API
        # No database and no server: the document is declared at import time,
        # and the lifespan that needs one never runs.
        run: make contract
