name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the run in progress; there is no value in finishing
  # a check against code nobody will merge.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        # The same image as development, not the plain one: the schema needs
        # pg_trgm, unaccent and btree_gist, and the tests exercise all three.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: konnekt
          POSTGRES_PASSWORD: konnekt
          POSTGRES_DB: konnekt
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U konnekt -d konnekt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5433
      # No bot token in CI, and the API tests need to authenticate somehow.
      # Signature handling is covered separately, against real HMAC.
      BOT_TOKEN: ''
      ALLOW_UNSIGNED_INIT_DATA: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Check the models and the migrations agree
        # A model changed without a migration passes every test and then fails
        # on deploy. This is the only place that catches it.
        run: uv run alembic check

      - name: Seed reference data
        # The tests match against real subjects and institutions, because the
        # matching *is* the logic — "матан" has to reach calculus.
        run: |
          uv run python -m konnekt.db.seed
          uv run python -m konnekt.db.demo

      - name: Test
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Check every message is translated
        # An untranslated string falls back to the Russian source *and* to
        # Russian plural rules, which is how "38 занятия" reaches a Czech
        # reader. Better to fail here than to ship it.
        run: pnpm i18n:extract --fail-on-missing

      - name: Build
        # mkcert wants a system trust store that CI does not have; the build
        # itself does not need HTTPS.
        env:
          VITE_NO_HTTPS: '1'
        run: pnpm build
